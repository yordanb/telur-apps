name: egg_production_app
description: Aplikasi Pencatatan Produksi Telur Ayam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  http: ^1.1.0
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  fl_chart: ^0.65.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.2
  connectivity_plus: ^5.0.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

# Generator icon launcher (python assets/icon/generate_icon.py -> PNG)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/endog_icon.png"
  adaptive_icon_background: "assets/icon/endog_bg.png"
  adaptive_icon_foreground: "assets/icon/endog_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
