services:
  api:
    build: .
    container_name: egg-api
    ports:
      - "8800:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - DEBUG=${DEBUG}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - egg-network

  db:
    image: postgres:15
    container_name: egg-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    restart: unless-stopped
    networks:
      - egg-network

  # Backup otomatis dilepas (2026-10-04): pemilik tidak memakai egg-backup.
  # Dump manual bila perlu:
  #   docker exec egg-db pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" | gzip > backups/manual-$(date +%Y%m%d_%H%M%S).sql.gz
  # File lama di backend/backups/ tetap tersimpan (bind mount, tidak ikut terhapus).

networks:
  egg-network:
    name: egg-netw

volumes:
  postgres_data:
  uploads:
